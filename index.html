<html lang="id"><head>

<title>MyPOS</title>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f3f6f5;--bg2:#e6edeb;--card:#fff;--tx:#10201c;--mut:#6a7b76;--pri:#0f766e;--in:#15803d;--out:#dc2626;--bd:#e3eae8;--glass:#f3f6f5d9;--g:linear-gradient(135deg,#0f766e,#14b8a6);--sh:0 1px 2px #10282210,0 10px 26px -12px #10282244}
@media(prefers-color-scheme:dark){:root{--bg:#0b1211;--bg2:#17211f;--card:#131c1a;--tx:#e8f1ee;--mut:#90a39e;--pri:#2dd4bf;--in:#4ade80;--out:#f87171;--bd:#22302d;--glass:#0b1211d9;--sh:0 1px 2px #0007,0 10px 26px -12px #000}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,sans-serif}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.3px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--g);display:grid;place-items:center;color:#fff;font:800 13px system-ui;box-shadow:0 4px 10px -2px #0f766e88}
.me{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:4px 12px 4px 4px;color:var(--mut);font-size:12px;box-shadow:var(--sh)}
.me b{width:26px;height:26px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:12px;text-transform:uppercase}
main{padding:6px 14px calc(160px + env(safe-area-inset-bottom));max-width:980px;margin:auto}
h1{font-size:24px;letter-spacing:-.5px;margin:14px 2px 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.hero{background:var(--g);color:#fff;border:0;position:relative;overflow:hidden;box-shadow:0 14px 30px -12px #0f766eaa}
.hero:after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:#ffffff1f}
.hero .mut{color:#ffffffcc}
.big{font-size:28px;font-weight:800;letter-spacing:-.6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g2 .card{margin:0}.g2{margin-bottom:12px}
.dg{display:grid;gap:12px;align-items:start}
@media(min-width:900px){.dg{grid-template-columns:1fr 1fr}}
.dg .card{margin-bottom:0}
.mut{color:var(--mut);font-size:12px}
.in{color:var(--in)}.out{color:var(--out)}
h4{margin:0 0 6px;font-size:15px}
.acc{padding:0;overflow:hidden}
.acc summary{display:flex;align-items:center;gap:8px;padding:16px;font-weight:700;cursor:pointer;list-style:none}
.acc summary::-webkit-details-marker{display:none}
.acc summary:after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:.2s}
.acc[open] summary:after{transform:rotate(-135deg)}
.acc .ab{padding:0 16px 12px}
.tx{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--bd)}
.tx:first-child{border-top:0}
.tm{flex:1;min-width:0}.tm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm small{display:block;color:var(--mut);font-size:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:3px 0;font-size:12px;color:var(--mut)}
.code{font:600 11px ui-monospace,Menlo,monospace;background:var(--bg2);padding:2px 7px;border-radius:6px;letter-spacing:.2px}
.av{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:800;flex:none}
.av.in{background:#15803d1f}.av.out{background:#dc26261f}
.amt{font-weight:700;white-space:nowrap}
.bdg{min-width:44px;text-align:center;padding:5px 10px;border-radius:20px;font-weight:700;background:#15803d1f}
.bdg.out{background:#dc26261f}
.x{background:none;border:0;color:var(--mut);font-size:19px;padding:4px 8px;border-radius:8px}
.x:active{background:var(--bg2)}
input,select{width:100%;padding:12px 13px;margin:4px 0 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;outline:0}
input:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px #14b8a62e}
select option:disabled{color:#999}
label{font-size:12px;color:var(--mut);font-weight:600}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--g);color:#fff;font-weight:700;box-shadow:0 8px 18px -8px #0f766ecc}
.btn:active{transform:scale(.98)}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;border-radius:11px;box-shadow:none}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:6;min-width:58px;height:58px;padding:0 20px;border:0;border-radius:29px;background:var(--g);color:#fff;font:700 22px system-ui;box-shadow:0 14px 28px -8px #0f766ecc,0 2px 6px #0003}
.fab:active{transform:scale(.94)}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;display:flex;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:22px;padding:6px;box-shadow:var(--sh)}
nav button{flex:1;background:none;border:0;border-radius:16px;padding:7px 0 6px;color:var(--mut);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.15s}
nav button.on{color:var(--pri);background:var(--bg2);font-weight:700}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand{display:none}
@media(min-width:900px){
 nav{left:0;top:0;bottom:0;right:auto;width:220px;flex-direction:column;border-radius:0;border-width:0 1px 0 0;padding:20px 12px;gap:4px;justify-content:flex-start}
 nav .brand{display:flex;margin:0 8px 18px}
 nav button{flex:none;flex-direction:row;gap:12px;padding:12px 14px;font-size:14px}
 .content{margin-left:220px}.logo.h{display:none}
 header{justify-content:flex-end}
 .fab{bottom:28px}main{padding-bottom:100px}
}
.seg{display:flex;background:var(--bg2);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:11px;color:var(--mut);font-size:13px;font-weight:600}
.seg .on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px #0002}
#md{position:fixed;inset:0;z-index:20;background:#0a1a1666;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end}
#mb{background:var(--card);width:100%;max-width:520px;margin:auto;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:600px){#md{align-items:center}#mb{border-radius:24px}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--bd);margin:0 auto 12px}
#mb h3{margin:0 0 8px;font-size:18px}
.tot{font-weight:800;font-size:18px;margin:2px 0 12px}
.info{font-size:12px;color:var(--mut);margin:-6px 0 10px}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:#10201cf2;color:#fff;padding:11px 18px;border-radius:22px;z-index:30;display:none;max-width:90%;text-align:center;box-shadow:var(--sh)}
.auth{max-width:380px;margin:9vh auto;padding:0 16px;text-align:center}
.auth .logo{justify-content:center;font-size:28px;margin-bottom:4px}.auth .logo i{width:48px;height:48px;border-radius:15px;font-size:20px}
.auth .card{text-align:left;padding:20px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl td,.tbl th{padding:9px 5px;border-top:1px solid var(--bd);text-align:left;vertical-align:top}
.tbl .r{text-align:right;white-space:nowrap}
h1{display:flex;align-items:center;gap:10px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--bg2);color:var(--pri);flex:none}
.ib .i{width:20px;height:20px}
.ib.in{background:#15803d1f;color:var(--in)}.ib.out{background:#dc26261f;color:var(--out)}
h1 .ib{width:34px;height:34px;border-radius:11px;background:var(--g);color:#fff;box-shadow:0 6px 14px -6px #0f766e99}
.st{display:flex;align-items:center;gap:12px}
.hero .ib{background:#ffffff2e;color:#fff}
.av .i{width:20px;height:20px}
.x .i{width:18px;height:18px}
.acc summary .i{color:var(--pri);width:20px;height:20px}
.fab{display:flex;align-items:center;justify-content:center;gap:6px}
.fab .i{width:26px;height:26px;stroke-width:2.2}
.fab:has(.i + span){padding:0 22px}
main>.seg+.card,.dg{margin-top:0}
.hero>*{position:relative;z-index:1}
.db .big{font-size:30px;margin:14px 0 14px}
.db .eye{background:#ffffff26;border:0;color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.inbox{background:#ffffff1f;border:1px solid #ffffff33;border-radius:16px;padding:12px 14px}
.inbox .two{display:flex;gap:12px;margin-top:10px;align-items:center}
.inbox .two>.st{flex:1;min-width:0;gap:10px}
.inbox .dv{width:1px;align-self:stretch;background:#ffffff40}
.hero .ib.in{background:#4ade8033;color:#bbf7d0}.hero .ib.out{background:#f8717140;color:#fecaca}
.ws{display:flex;gap:12px;overflow-x:auto;margin:0 -14px 12px;padding:4px 14px 10px;scroll-snap-type:x proximity;scrollbar-width:none}
.ws::-webkit-scrollbar{display:none}
.wc{flex:none;width:160px;scroll-snap-align:start;position:relative;overflow:hidden;color:#fff;border-radius:18px;padding:12px 14px;opacity:.78;border:2px solid transparent;transition:.15s;box-shadow:var(--sh);cursor:pointer}
.wc.on{opacity:1;border-color:#ffffffd9;box-shadow:0 12px 24px -10px #0007}
.wc b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.wl{font-size:12px;opacity:.85;margin-top:14px}
.wa{font-weight:800;font-size:16px;letter-spacing:-.3px;position:relative;z-index:1}
.wd{position:absolute;right:-8px;bottom:-10px;opacity:.16}.wd .i{width:64px;height:64px;stroke-width:1.5}
.ck{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#ffffff40}.ck .i{width:12px;height:12px;stroke-width:3}
.lnk{color:var(--pri);font-weight:600;font-size:13px;text-decoration:none}
a.more{display:block;padding:10px 0 4px;text-align:center;color:var(--pri);font-weight:600;font-size:13px;text-decoration:none}
.acc summary.sm{padding:14px;font-weight:400}
.acc summary .tm b{font-weight:700}
textarea{width:100%;padding:12px 13px;margin:4px 0 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;outline:0;resize:vertical}
textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px #14b8a62e}
.seg button{font-size:12.5px;padding:9px 2px}
.btn.alt{background:var(--bg2);color:var(--tx);box-shadow:none}
.btn .i{margin-right:6px;vertical-align:-4px}
.lgp{width:72px;height:72px;border-radius:16px;background:var(--bg2);display:grid;place-items:center;overflow:hidden;flex:none}
.lgp img{width:100%;height:100%;object-fit:contain}
.inv{background:#fff;color:#111;border:1px solid var(--bd);border-radius:14px;padding:18px;font-size:13px;line-height:1.45}
.inv .hd{display:flex;gap:12px;align-items:center;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:10px}
.inv .hd img{max-height:58px;max-width:90px;object-fit:contain}
.inv h2{margin:0;font-size:18px;letter-spacing:-.3px}
.inv .sx{font-size:11.5px;color:#444}
.inv .iv2{display:flex;justify-content:space-between;gap:10px}
.inv table{width:100%;border-collapse:collapse;margin:10px 0}
.inv th,.inv td{padding:7px 4px;text-align:left;border-bottom:1px solid #ddd;font-size:12px}
.inv th{background:#f1f5f4}.inv .r{text-align:right}
.inv .tt{display:flex;justify-content:space-between;font-weight:800;font-size:16px;border-top:2px solid #111;padding-top:8px}
.inv .ft{margin-top:10px;text-align:center;font-size:11.5px;color:#444}
.inv.rc{max-width:300px;margin:auto;font-size:12px}
.inv.rc .hd{flex-direction:column;text-align:center}
@media print{
 body>*:not(#md){display:none!important}
 body{background:#fff!important}
 #md{position:static!important;display:block!important;background:none!important;backdrop-filter:none!important}
 #mb{max-width:none!important;max-height:none!important;overflow:visible!important;box-shadow:none!important;padding:0!important;animation:none!important;border-radius:0!important;background:#fff!important}
 .noprint,.grab{display:none!important}
 .inv{border:0!important;border-radius:0!important;padding:0!important}
}

<body>
<div id="app"></div><div id="md" onclick="if(event.target==this)closeM()"><div id="mb"></div></div><div id="toast"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbyBTJy0MxaKClRbe5s16WpdvlcCcvxJ00fl6JyglyjJVGlbqH2BlkzQtoH7oXWb43H-9g/exec'; // <- URL deployment Apps Script (berakhiran /exec)
const $=s=>document.querySelector(s);
// ---------- format ----------
const grp=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const gm=n=>{n=Math.round(+n||0);return(n<0?'-':'')+grp(String(Math.abs(n)))};
const rp=n=>(+n<0?'-':'')+'Rp '+grp(String(Math.round(Math.abs(+n||0))));
const nf=n=>{const[a,b]=String(+(+n||0).toFixed(2)).split('.');return grp(a)+(b?','+b:'')};
const fm=el=>{const d=el.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'');el.value=d?grp(d):''};
const pv=id=>+String($('#'+id).value).replace(/\./g,'')||0;
const mi=(id,v,extra='')=>`<input id="${id}" inputmode="numeric" autocomplete="off" value="${gm(v)}" oninput="fm(this);${extra}">`;
const BL=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const nd=s=>{s=String(s??'');if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const d=new Date(s);if(isNaN(d))return s.slice(0,10);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fd=s=>{const a=nd(s).split('-');return a.length==3&&BL[a[1]-1]?(+a[2])+' '+BL[a[1]-1]+' '+a[0]:s};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const T={dash:'Dashboard',sales:'Penjualan',buy:'Pembelian',stock:'Stok',rep:'Laporan',set:'Setting'};
const IC={dash:'<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>',
sales:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
buy:'<path d="M6 6h15l-1.5 9h-12zM6 6L5 3H2"/><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/>',
stock:'<path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/>',
rep:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5M9 13h6M9 17h4"/>',
set:'<path d="M4 6h8M16 6h4M4 12h2M10 12h10M4 18h12"/><circle cx="14" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'};
const SV={plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',down:'<path d="M12 5v14M6 13l6 6 6-6"/>',up:'<path d="M12 19V5M6 11l6-6 6 6"/>',wallet:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/>',bank:'<path d="M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/>',flow:'<path d="M4 8h14l-3-3M20 16H6l3 3"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.5v.5"/>',tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>',print:'<path d="M7 9V3h10v6M7 17H5a2 2 0 01-2-2v-4a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2h-2M7 14h10v7H7z"/>',dl:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',eyeoff:'<path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0112 6c6 0 10 6 10 6a17 17 0 01-3.2 3.7M6.6 6.7A17 17 0 002 12s4 7 10 7a9.7 9.7 0 004-.9M9.9 9.9a3 3 0 004.2 4.2"/>',check:'<path d="M5 12l5 5 9-10"/>',layers:'<path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/>'};
const ic=(n,c='i')=>`<svg class="${c}" viewBox="0 0 24 24">${SV[n]||IC[n]||''}</svg>`;
const stat=(ico,cls,l,v)=>`<div class="card st"><div class="ib ${cls}">${ic(ico)}</div><div><div class="mut">${l}</div><b class="${cls}">${v}</b></div></div>`;
const mk=n=>HID?'Rp ••••••':rp(n);
const WP=['#16a34a,#4ade80','#2563eb,#60a5fa','#d97706,#fbbf24','#7c3aed,#a78bfa','#db2777,#f472b6','#0891b2,#22d3ee'];
const wc=(id,name,ico,amt,bg,on)=>`<div class="wc ${on?'on':''}" style="background:linear-gradient(135deg,${bg})" onclick="dw='${id}';render()"><div class="st" style="gap:8px"><span class="wi">${ic(ico)}</span><b>${esc(name)}</b>${on?`<span class="ck">${ic('check')}</span>`:''}</div><div class="wl">${id=='all'?'Total Saldo':'Saldo'}</div><div class="wa">${mk(amt)}</div><span class="wd">${ic(ico)}</span></div>`;
const toggleHid=()=>{HID=!HID;localStorage.hid=HID?1:0;render()};
const plabel=p=>p.m=='month'?(m=>BL[m[1]-1]+' '+m[0])((p.month||today().slice(0,7)).split('-')):p.m=='range'?((p.from||p.to)?fd(p.from||'…')+' – '+fd(p.to||'…'):'Semua'):'Bulan Ini';
const logsOf=(k,id)=>[...D.StockLog].reverse().filter(l=>l.kind==k&&l.itemId==id).sort((a,b)=>b.date.localeCompare(a.date));
const logRow=l=>`<div class="tx"><div class="av ${l.qty>0?'in':'out'}">${ic(l.qty>0?'plus':'minus')}</div><div class="tm"><b>${l.qty>0?'Tambah':'Kurangi'} stok</b><div class="meta"><span>${fd(l.date)}</span></div>${l.note?`<small>${esc(l.note)}</small>`:''}</div><span class="amt ${l.qty>0?'in':'out'}">${l.qty>0?'+':''}${nf(l.qty)}</span><button class="x" onclick="delLog('${l.id}')">${ic('trash')}</button></div>`;
const accI=(id,sm,b)=>`<details class="card acc" ${OPEN[id]?'open':''} ontoggle="OPEN['${id}']=this.open"><summary class="sm">${sm}</summary><div class="ab">${b}</div></details>`;
const EMPTY=()=>({Wallets:[],Products:[],Materials:[],Sales:[],Purchases:[],StockLog:[],Store:[],BalanceLog:[]});
let tok=localStorage.tk,user=localStorage.us,view='dash',mode='login',stab='Wallets',sk='Products',D=EMPTY(),FT='Sales',OPEN={},dw='all',HK=null,HID=localStorage.hid=='1',LG=null,PAPER=localStorage.paper||'A4',INV=null;
const P={dash:{m:'this'},sales:{m:'week'},buy:{m:'week'},rep:{m:'week'}};
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const NM={Products:'Produk',Materials:'Bahan Baku',Wallets:'Dompet/Rek.',Store:'Toko'};
const acc=(id,t,b,def)=>`<details class="card acc" ${(OPEN[id]??def)?'open':''} ontoggle="OPEN['${id}']=this.open"><summary>${t}</summary><div class="ab">${b}</div></details>`;

async function api(a,o={}){
  if(API.startsWith('PASTE'))throw new Error('API belum diisi di index.html');
  const r=await fetch(API,{method:'POST',body:JSON.stringify({a,token:tok,...o})});
  const j=await r.json();
  if(!j.ok){if(/sesi/i.test(j.error))logout();throw new Error(j.error)}
  return j;
}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
const modalOpen=()=>$('#md').style.display=='flex';
function modal(h){$('#mb').innerHTML='<div class="grab"></div>'+h;if(!modalOpen())history.pushState({m:1,v:view},'');$('#md').style.display='flex'}
function hideM(){$('#md').style.display='none';HK=null}
function closeM(){if(!modalOpen())return;hideM();if(history.state&&history.state.m)history.back()}

// ---------- periode ----------
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function rng(p){
  const t=today(),pad=n=>String(n).padStart(2,'0');
  if(p.m=='range')return[p.from||'0000-01-01',p.to||'9999-12-31'];
  if(p.m=='week'){const e=new Date(),b=new Date();b.setDate(e.getDate()-6);return[ymd(b),ymd(e)]}
  const m=(p.m=='month'&&p.month)||t.slice(0,7);
  return[m+'-01',m+'-'+pad(new Date(m.slice(0,4),m.slice(5),0).getDate())];
}
const inR=(x,p)=>{const[a,b]=rng(p);return x.date>=a&&x.date<=b};
function periodUI(k){
  const p=P[k],c=(v,l)=>`<button class="${p.m==v?'on':''}" onclick="setP('${k}','m','${v}')">${l}</button>`;
  return `<div class="seg">${k=='dash'?c('this','Bulan ini'):c('week','Minggu ini')}${c('month','Pilih bulan')}${c('range','Rentang')}</div>`+
  (p.m=='month'?`<input type="month" value="${p.month||today().slice(0,7)}" onchange="setP('${k}','month',this.value)">`:'')+
  (p.m=='range'?`<div class="g2" style="margin-bottom:0"><div><label>Tanggal awal</label><input type="date" value="${p.from||''}" ${p.to?`max="${p.to}"`:''} onchange="setP('${k}','from',this.value)"></div><div><label>Tanggal akhir</label><input type="date" value="${p.to||''}" ${p.from?`min="${p.from}"`:''} onchange="setP('${k}','to',this.value)"></div></div>`:'');
}
function setP(k,f,v){
  const p=P[k];
  if(f=='from'&&v&&p.to&&v>p.to){toast('Tanggal awal tidak boleh lebih besar dari tanggal akhir');return render()}
  if(f=='to'&&v&&p.from&&v<p.from){toast('Tanggal akhir tidak boleh lebih kecil dari tanggal awal');return render()}
  p[f]=v;if(f=='m'&&v=='month'&&!p.month)p.month=today().slice(0,7);render();
}

// ---------- data & stok ----------
const sum=a=>a.reduce((x,s)=>x+ +s.total,0);
const wname=id=>(D.Wallets.find(w=>w.id==id)||{name:'(terhapus)'}).name;
const bal=w=>(+w.initial||0)+sum(D.Sales.filter(s=>s.walletId==w.id))-sum(D.Purchases.filter(s=>s.walletId==w.id))+D.BalanceLog.filter(l=>l.walletId==w.id).reduce((a,l)=>a+ +l.amount,0);
function stk(k,it){
  const adj=D.StockLog.filter(l=>l.kind==k&&l.itemId==it.id).reduce((a,l)=>a+ +l.qty,0);
  const mv=(k=='Products'?D.Sales:D.Purchases).filter(x=>x.itemId==it.id).reduce((a,x)=>a+ +x.qty,0);
  const init=+it.stock||0;
  return{init,adj,mv,cur:init+adj+(k=='Products'?-mv:mv)};
}
const isLow=(k,it)=>stk(k,it).cur<=(+it.min||0);
function txs(p){
  const all=[...D.Sales.map(s=>({...s,k:'Penjualan',in:1})),...D.Purchases.map(s=>({...s,k:'Pembelian',in:0}))];
  return(p?all.filter(x=>inR(x,p)):all).sort((a,b)=>b.date.localeCompare(a.date));
}
const code=x=>(x.in?'PJ':'PB')+'-'+x.date.replace(/-/g,'').slice(2)+'-'+String(x.id).slice(0,4).toUpperCase();
const iname=x=>((x.in?D.Products:D.Materials).find(i=>i.id==x.itemId)||{}).name||x.item;
const txRow=(x,del)=>`<div class="tx"><div class="av ${x.in?'in':'out'}">${ic(x.in?'down':'up')}</div><div class="tm"><b>${esc(iname(x))}</b><div class="meta"><span class="code">${code(x)}</span><span>${fd(x.date)}</span></div><small>${esc(wname(x.walletId))} · ${nf(x.qty)} × ${rp(x.price)}${x.note?' · '+esc(x.note):''}</small></div><span class="amt ${x.in?'in':'out'}">${x.in?'+':'-'}${rp(x.total)}</span>${del=='Sales'?`<button class="x" title="Cetak invoice" onclick="openInvoice('${x.id}')">${ic('print')}</button>`:''}${del?`<button class="x" onclick="del('${del}','${x.id}')">${ic('trash')}</button>`:''}</div>`;

// ---------- tampilan ----------
const V={
  dash(){
    const p=P.dash;
    if(dw!='all'&&!D.Wallets.some(w=>w.id==dw))dw='all';
    const sel=dw=='all'?null:D.Wallets.find(w=>w.id==dw),f=x=>!sel||x.walletId==sel.id;
    const i=sum(D.Sales.filter(x=>inR(x,p)&&f(x))),o=sum(D.Purchases.filter(x=>inR(x,p)&&f(x)));
    const all=D.Wallets.reduce((a,w)=>a+bal(w),0),tot=sel?bal(sel):all,last=txs().filter(f).slice(0,10);
    return periodUI('dash')+`<div class="card hero db">
      <div class="st" style="justify-content:space-between"><div class="st" style="gap:8px">${ic('wallet')}<span class="mut">${sel?'Saldo '+esc(sel.name):'Total Keseluruhan Saldo'}</span></div><button class="eye" onclick="toggleHid()">${ic(HID?'eyeoff':'eye')}</button></div>
      <div class="big">${mk(tot)}</div>
      <div class="inbox"><div class="st" style="justify-content:space-between"><b>Arus Kas ${plabel(p)}</b><span class="mut">Selisih ${mk(i-o)}</span></div>
      <div class="two"><div class="st"><div class="ib in">${ic('down')}</div><div><div class="mut">Pemasukan</div><b>${mk(i)}</b></div></div><div class="dv"></div><div class="st"><div class="ib out">${ic('up')}</div><div><div class="mut">Pengeluaran</div><b>${mk(o)}</b></div></div></div></div></div>
    <div class="st" style="justify-content:space-between;margin:6px 2px 8px"><b>Dompet & Rekening</b><span><a href="#" class="lnk" onclick="openBal('${dw=='all'?'':dw}');return false">± Ubah Saldo</a><a href="#" class="lnk" style="margin-left:16px" onclick="stab='Wallets';go('set');return false">Kelola</a></span></div>
    <div class="ws">${wc('all','Semua','layers',all,'#0f766e,#14b8a6',dw=='all')}${D.Wallets.map((w,n)=>wc(w.id,w.name,w.type=='Rekening'?'bank':'wallet',bal(w),WP[n%WP.length],dw==w.id)).join('')}</div>
    ${acc('last10',ic('clock')+' 10 Transaksi Terakhir',last.map(x=>txRow(x)).join('')||'<div class="mut">Belum ada transaksi.</div>',false)}
    ${acc('ballog',ic('flow')+' Riwayat Saldo',(b=>b.map(balRow).join('')||'<div class="mut">Belum ada penambahan atau pengurangan saldo.</div>')([...D.BalanceLog].reverse().filter(l=>dw=='all'||l.walletId==dw).sort((a,c)=>c.date.localeCompare(a.date)).slice(0,10)),false)}`;
  },
  sales:()=>list('Sales'),
  buy:()=>list('Purchases'),
  stock(){
    const k=sk,items=D[k],low=items.filter(x=>isLow(k,x)).length;
    return `<div class="seg">${['Products','Materials'].map(t=>`<button class="${t==k?'on':''}" onclick="sk='${t}';render()">${NM[t]}</button>`).join('')}</div>
    <div class="g2"><div class="card"><div class="mut">Jumlah item</div><div class="big">${items.length}</div></div><div class="card"><div class="mut">Stok menipis</div><div class="big ${low?'out':''}">${low}</div></div></div>`+
    (items.map(x=>{
      const s=stk(k,x),lo=isLow(k,x),lg=logsOf(k,x.id);
      const sm=`<div class="ib ${lo?'out':'in'}">${ic('stock')}</div><div class="tm"><b>${esc(x.name)}</b><small>Awal ${nf(s.init)} · ${k=='Products'?'Terjual':'Dibeli'} ${nf(s.mv)} · Koreksi ${s.adj>0?'+':''}${nf(s.adj)}</small></div><span class="bdg ${lo?'out':'in'}">${nf(s.cur)}</span><button class="btn sm" onclick="event.preventDefault();event.stopPropagation();openAdj('${k}','${x.id}')">Atur</button>`;
      const b=lg.length?`<div class="mut" style="margin-bottom:2px">5 riwayat penyesuaian terakhir</div>${lg.slice(0,5).map(logRow).join('')}<a href="#" class="more" onclick="openHist('${k}','${x.id}');return false">Lihat Selengkapnya (${lg.length}) →</a>`:'<div class="mut" style="padding:2px 0 8px">Belum ada riwayat penyesuaian.</div>';
      return accI('sk'+x.id,sm,b);
    }).join('')||`<div class="card mut">Belum ada ${NM[k]}. Tambahkan di Setting.</div>`);
  },
  rep(){
    const t=txs(P.rep),i=sum(t.filter(x=>x.in)),o=sum(t.filter(x=>!x.in));
    return periodUI('rep')+`<div class="g2">${stat('down','in','Penjualan',rp(i))}${stat('up','out','Pembelian',rp(o))}</div>
    <div class="card hero st"><div class="ib">${ic('flow')}</div><div><div class="mut">Selisih saldo</div><div class="big">${rp(i-o)}</div></div></div>
    <div class="card" style="overflow:auto"><table class="tbl"><tr><th>Tanggal / Kode</th><th>Keterangan</th><th class="r">Masuk</th><th class="r">Keluar</th></tr>
    ${t.map(x=>`<tr><td style="white-space:nowrap">${fd(x.date)}<br><span class="code">${code(x)}</span></td><td><b>${esc(iname(x))}</b><br><span class="mut">${x.k} · ${nf(x.qty)} × ${rp(x.price)}<br>${esc(wname(x.walletId))}</span></td><td class="r in">${x.in?rp(x.total):''}</td><td class="r out">${x.in?'':rp(x.total)}</td></tr>`).join('')||'<tr><td colspan=4 class="mut">Tidak ada transaksi.</td></tr>'}
    <tr><th colspan=2>Total</th><th class="r">${rp(i)}</th><th class="r">${rp(o)}</th></tr></table></div>`;
  },
  set(){
    if(stab=='Store')return setSeg()+storeUI();
    const items=D[stab],w=stab=='Wallets';
    let f=`<label>Nama</label><input id="s_n">`;
    if(w)f+=`<label>Jenis</label><select id="s_t"><option>Dompet</option><option>Rekening</option></select><label>Saldo awal</label>${mi('s_p',0)}`;
    else f+=`<label>Harga satuan</label>${mi('s_p',0)}<div class="g2" style="margin:0"><div><label>Stok awal</label><input id="s_s" type="number" inputmode="decimal" value="0"></div><div><label>Stok minimum</label><input id="s_m" type="number" inputmode="decimal" value="0"></div></div>`;
    return `${setSeg()}
    ${acc('add'+stab,ic('plus')+' Tambah '+NM[stab],f+`<button class="btn" onclick="addSet()">Simpan</button>`,false)}
    <div class="card"><h4>Daftar ${NM[stab]}</h4>${items.map(x=>`<div class="tx"><div class="ib">${ic(w?(x.type=='Rekening'?'bank':'wallet'):stab=='Products'?'tag':'stock')}</div><div class="tm"><b>${esc(x.name)}</b><small>${w?esc(x.type)+' · saldo '+rp(bal(x))+' (awal '+rp(x.initial)+')':rp(x.price)+' · stok awal '+nf(x.stock)+' · min '+nf(x.min)}</small></div>${w?`<button class="x" title="Ubah saldo" onclick="openBal('${x.id}')">${ic('flow')}</button>`:''}<button class="x" onclick="openEdit('${stab}','${x.id}')" title="Edit">${ic('edit')}</button><button class="x" onclick="del('${stab}','${x.id}')">${ic('trash')}</button></div>`).join('')||'<div class="mut">Belum ada data.</div>'}</div>`;
  }
};
function list(t){
  const k=t=='Sales'?'sales':'buy',r=txs(P[k]).filter(x=>x.in==(t=='Sales'?1:0));
  return periodUI(k)+`<div class="card hero st"><div class="ib">${ic(t=='Sales'?'down':'up')}</div><div><div class="mut">Total ${t=='Sales'?'penjualan':'pembelian'}</div><div class="big">${rp(sum(r))}</div></div></div>
  <div class="card">${r.map(x=>txRow(x,t)).join('')||'<div class="mut">Tidak ada transaksi pada periode ini.</div>'}</div>`;
}
function render(){
  if(!tok)return authUI();
  const fab=view=='rep'?`<button class="fab" onclick="pdf()">${ic('dl')}<span>PDF</span></button>`:(view=='sales'||view=='buy')?`<button class="fab" onclick="openAdd('${view=='sales'?'Sales':'Purchases'}')">${ic('plus')}</button>`:'';
  $('#app').innerHTML=`<div class="content"><header><div class="logo h"><i>M</i>MyPOS</div><button class="me" onclick="if(confirm('Keluar dari akun?'))logout()"><b>${esc(user[0])}</b>Keluar</button></header><main><h1><span class="ib">${ic(view)}</span>${T[view]}</h1>${V[view]()}</main></div>${fab}<nav><div class="brand"><div class="logo"><i>M</i>MyPOS</div></div>${Object.keys(T).map(k=>`<button class="${k==view?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${IC[k]}</svg><span>${T[k]}</span></button>`).join('')}</nav>`;
}
function go(v){if(v!=view){view=v;history.pushState({v},'')}render();scrollTo(0,0)}

// ---------- autentikasi ----------
function authUI(){
  const r=mode=='register';
  $('#app').innerHTML=`<div class="auth"><div class="logo"><i>M</i>MyPOS</div><p class="mut" style="margin-bottom:20px">Pencatatan penjualan, pembelian & stok</p>
  <div class="card"><label>Username</label><input id="a_u" autocapitalize="none" autocomplete="username"><label>Password</label><input id="a_p" type="password" autocomplete="${r?'new':'current'}-password">
  ${r?'<label>Kode pendaftaran</label><input id="a_c">':''}<button class="btn" onclick="auth()">${r?'Daftar':'Masuk'}</button>
  <p style="text-align:center;margin-bottom:0"><a href="#" onclick="mode='${r?'login':'register'}';render();return false" style="color:var(--pri)">${r?'Sudah punya akun? Masuk':'Belum punya akun? Daftar'}</a></p></div></div>`;
}
async function auth(){
  try{
    const j=await api(mode,{username:$('#a_u').value,password:$('#a_p').value,code:$('#a_c')?.value});
    tok=j.token;user=j.user;localStorage.tk=tok;localStorage.us=user;render();sync();
  }catch(e){toast(e.message)}
}
function logout(){tok=user=null;localStorage.removeItem('tk');localStorage.removeItem('us');D=EMPTY();render()}
async function sync(){try{const j=(await api('sync')).data;['Sales','Purchases','StockLog','BalanceLog'].forEach(k=>(j[k]||[]).forEach(x=>x.date=nd(x.date)));D={...EMPTY(),...j};render()}catch(e){toast(e.message)}}

// ---------- transaksi ----------
function openAdd(t){
  FT=t;const k=t=='Sales'?'Products':'Materials',it=D[k],nm=t=='Sales'?'Produk':'Bahan Baku';
  if(!it.length||!D.Wallets.length)return toast(`Tambahkan ${nm} dan Dompet/Rekening di Setting dulu`);
  if(t=='Sales'&&!it.some(x=>stk(k,x).cur>0))return toast('Semua produk stoknya habis, penjualan tidak dapat dilakukan');
  modal(`<h3>${t=='Sales'?'Tambah Penjualan':'Tambah Pembelian'}</h3>
  <label>Tanggal</label><input id="f_d" type="date" value="${today()}">
  <label>${nm}</label><select id="f_i" onchange="pick()">${it.map(x=>{const out=t=='Sales'&&stk(k,x).cur<=0;return `<option value="${x.id}" ${out?'disabled':''}>${esc(x.name)}${out?' (stok habis)':''}</option>`}).join('')}</select><div class="info" id="f_s"></div>
  <div class="g2" style="margin:0"><div><label>Jumlah</label><input id="f_q" type="number" inputmode="decimal" value="1" min="0" step="any" oninput="calc()"></div><div><label>Harga satuan</label>${mi('f_p',0,'calc()')}</div></div>
  <div class="tot" id="f_t"></div>
  <label>${t=='Sales'?'Masuk ke':'Dibayar dari'}</label><select id="f_w" onchange="calc()">${D.Wallets.map(w=>`<option value="${w.id}">${esc(w.name)}${t=='Purchases'?' · '+rp(bal(w)):''}</option>`).join('')}</select><div class="info" id="f_b"></div>
  <label>Catatan (opsional)</label><input id="f_n"><button class="btn" onclick="save()">Simpan</button>`);
  pick();
}
function pick(){
  const k=FT=='Sales'?'Products':'Materials',it=D[k].find(x=>x.id==$('#f_i').value);
  $('#f_p').value=gm(it?it.price:0);$('#f_s').textContent=it?'Stok saat ini: '+nf(stk(k,it).cur):'';calc();
}
function calc(){
  const tot=($('#f_q').value||0)*pv('f_p');$('#f_t').textContent='Total: '+rp(tot);
  if(FT=='Purchases'){const w=D.Wallets.find(x=>x.id==$('#f_w').value),b=bal(w),bad=tot>b;
    $('#f_b').textContent='Saldo tersedia: '+rp(b)+(bad?' (tidak mencukupi)':'');$('#f_b').style.color=bad?'var(--out)':''}
}
async function save(){
  const t=FT,k=t=='Sales'?'Products':'Materials',it=D[k].find(x=>x.id==$('#f_i').value),q=+$('#f_q').value,p=pv('f_p'),tot=q*p;
  if(!$('#f_d').value||!(q>0))return toast('Tanggal dan jumlah wajib diisi');
  if(t=='Sales'){
    const cur=stk(k,it).cur;
    if(cur<=0)return toast(`Stok ${it.name} habis, penjualan tidak dapat dilakukan`);
    if(q>cur)return toast(`Stok ${it.name} tidak cukup (tersisa ${nf(cur)})`);
  }else{
    const w=D.Wallets.find(x=>x.id==$('#f_w').value),b=bal(w);
    if(tot>b)return toast(`Saldo ${w.name} tidak mencukupi (tersedia ${rp(b)})`);
  }
  try{
    const row={date:$('#f_d').value,itemId:it.id,item:it.name,qty:q,price:p,total:tot,walletId:$('#f_w').value,note:$('#f_n').value};
    const nr=(await api('add',{t,row})).row;D[t].push(nr);render();if(t=='Sales')openInvoice(nr.id);else closeM();toast('Tersimpan, stok & saldo diperbarui');
  }catch(e){toast(e.message)}
}
async function del(t,id){
  if(!confirm('Hapus data ini?'+(t=='Sales'||t=='Purchases'?' Stok & saldo akan menyesuaikan kembali.':'')))return;
  try{await api('del',{t,id});D[t]=D[t].filter(x=>x.id!=id);render()}catch(e){toast(e.message)}
}

// ---------- setting: tambah & edit ----------
async function addSet(){
  const n=$('#s_n').value.trim();if(!n)return toast('Nama wajib diisi');
  const v=pv('s_p'),row=stab=='Wallets'?{name:n,type:$('#s_t').value,initial:v}:{name:n,price:v,stock:+$('#s_s').value||0,min:+$('#s_m').value||0};
  try{D[stab].push((await api('add',{t:stab,row})).row);OPEN['add'+stab]=false;render();toast('Tersimpan')}catch(e){toast(e.message)}
}
function openEdit(t,id){
  const x=D[t].find(i=>i.id==id),w=t=='Wallets';
  modal(`<h3>Edit ${NM[t]}</h3><label>Nama</label><input id="e_n" value="${esc(x.name)}">`+
  (w?`<label>Jenis</label><select id="e_t"><option ${x.type=='Dompet'?'selected':''}>Dompet</option><option ${x.type=='Rekening'?'selected':''}>Rekening</option></select><label>Saldo awal</label>${mi('e_p',x.initial)}`
  :`<label>Harga satuan</label>${mi('e_p',x.price)}<div class="g2" style="margin:0"><div><label>Stok awal</label><input id="e_s" type="number" inputmode="decimal" value="${+x.stock||0}"></div><div><label>Stok minimum</label><input id="e_m" type="number" inputmode="decimal" value="${+x.min||0}"></div></div>`)+
  `<button class="btn" onclick="saveEdit('${t}','${id}')">Simpan Perubahan</button>`);
}
async function saveEdit(t,id){
  const n=$('#e_n').value.trim();if(!n)return toast('Nama wajib diisi');
  const v=pv('e_p'),row=t=='Wallets'?{name:n,type:$('#e_t').value,initial:v}:{name:n,price:v,stock:+$('#e_s').value||0,min:+$('#e_m').value||0};
  try{const j=await api('upd',{t,id,row});D[t]=D[t].map(x=>x.id==id?{...x,...j.row}:x);closeM();render();toast('Perubahan disimpan')}catch(e){toast(e.message)}
}

// ---------- penyesuaian stok ----------
function openAdj(k,id){
  const it=D[k].find(x=>x.id==id);
  modal(`<h3>Atur Stok</h3><p class="mut" style="margin-top:0">${esc(it.name)} · stok saat ini <b>${nf(stk(k,it).cur)}</b></p>
  <label>Tanggal</label><input id="j_d" type="date" value="${today()}">
  <label>Jenis</label><select id="j_m"><option value="1">Tambah stok (produksi / stok masuk)</option><option value="-1">Kurangi stok (rusak / hilang / koreksi)</option></select>
  <label>Jumlah</label><input id="j_q" type="number" inputmode="decimal" min="0" step="any" value="1">
  <label>Catatan (opsional)</label><input id="j_n"><button class="btn" onclick="saveAdj('${k}','${id}')">Simpan</button>`);
}
function openHist(k,id){
  HK=[k,id];const it=D[k].find(x=>x.id==id),lg=logsOf(k,id);
  modal(`<h3>Riwayat Penyesuaian</h3><p class="mut" style="margin-top:0">${esc(it.name)} · stok saat ini <b>${nf(stk(k,it).cur)}</b> · ${lg.length} catatan</p>${lg.map(logRow).join('')||'<div class="mut">Belum ada riwayat.</div>'}`);
}
async function delLog(id){
  if(!confirm('Hapus riwayat penyesuaian ini? Stok akan menyesuaikan kembali.'))return;
  const h=HK;
  try{await api('del',{t:'StockLog',id});D.StockLog=D.StockLog.filter(x=>x.id!=id);render();if(h&&modalOpen())openHist(...h)}catch(e){toast(e.message)}
}
const getStore=()=>D.Store[0]||{};
const nl=t=>esc(t).replace(/\n/g,'<br>');
const setSeg=()=>`<div class="seg">${Object.keys(NM).map(k=>`<button class="${k==stab?'on':''}" onclick="stab='${k}';LG=null;render()">${NM[k]}</button>`).join('')}</div>`;
function storeUI(){

  <label>Logo</label><div class="st" style="margin:6px 0 12px"><div class="lgp" id="lgp">${st.logo?`<img src="${esc(st.logo)}" alt="" onerror="this.style.display='none'">`:'<span class="mut">Belum ada</span>'}</div>

  <label>Nama toko</label><input id="t_n" value="${esc(st.name)}" autocomplete="off">

  <button class="btn" onclick="saveStore()">Simpan Identitas Toko</button></div>`;

function readLogo(inp){
  const f=inp.files[0];if(!f)return;
  if(!/^image\//.test(f.type))return toast('File harus berupa gambar');
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,400/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const mime=f.type=='image/jpeg'?'image/jpeg':'image/png',u=c.toDataURL(mime,.9);
    LG={data:u.split(',')[1],mime};$('#lgp').innerHTML=`<img src="${u}" alt="">`;
  };im.onerror=()=>toast('Gambar tidak dapat dibaca');im.src=rd.result};
  rd.readAsDataURL(f);
}
function rmLogo(){LG={remove:true};$('#lgp').innerHTML='<span class="mut">Belum ada</span>'}
async function saveStore(){
  const n=$('#t_n').value.trim();if(!n)return toast('Nama toko wajib diisi');
  const st=getStore();let logo=st.logo||'',logoId=st.logoId||'';
  try{
    if(LG&&LG.data){toast('Mengunggah logo…');const j=await api('logo',{data:LG.data,mime:LG.mime,oldId:logoId});logo=j.url;logoId=j.id}
    else if(LG&&LG.remove){if(logoId)await api('logo',{oldId:logoId});logo='';logoId=''}
    const row={name:n,address:$('#t_a').value.trim(),phone:$('#t_h').value.trim(),note:$('#t_k').value.trim(),logo,logoId};
    if(st.id){const j=await api('upd',{t:'Store',id:st.id,row});D.Store=[{...st,...j.row}]}
    else D.Store=[(await api('add',{t:'Store',row})).row];
    LG=null;render();toast('Identitas toko disimpan');
  }catch(e){toast(e.message)}
}

  <div class="iv2"><div><b>INVOICE</b><div class="sx">No: ${code(x)}</div></div><div class="sx" style="text-align:right">Tanggal: ${fd(x.date)}<br>Kasir: ${esc(user)}</div></div>
  <table><tr><th>Item</th><th class="r">Qty</th><th class="r">Harga</th><th class="r">Subtotal</th></tr><tr><td>${esc(iname(x))}</td><td class="r">${nf(x.qty)}</td><td class="r">${rp(x.price)}</td><td class="r">${rp(x.total)}</td></tr></table>

  ${st.note?`<div class="ft">${nl(st.note)}</div>`:''}<div class="ft">Terima kasih atas kunjungan Anda</div></div>`;

function openInvoice(id){
  const s=D.Sales.find(x=>x.id==id);if(!s)return;INV=id;
  modal(`<div class="noprint"><h3>Invoice</h3><div class="seg"><button class="${PAPER=='A4'?'on':''}" onclick="setPaper('A4')">A4</button><button class="${PAPER=='rc'?'on':''}" onclick="setPaper('rc')">Struk 80mm</button></div></div>${invHTML({...s,in:1})}
  <div class="noprint" style="margin-top:14px">${getStore().name?'':'<div class="mut" style="margin-bottom:8px">Isi identitas toko di Setting → Toko agar nama, alamat & logo tampil.</div>'}<button class="btn" onclick="printInv()">${ic('print')} Cetak Invoice</button><button class="btn alt" style="margin-top:8px" onclick="closeM()">Tutup</button></div>`);
}
function setPaper(p){PAPER=p;localStorage.paper=p;openInvoice(INV)}
function printInv(){$('#pg').textContent=PAPER=='rc'?'@page{size:80mm auto;margin:3mm}':'@page{size:A4;margin:14mm}';setTimeout(()=>window.print(),60)}
const balRow=l=>`<div class="tx"><div class="av ${l.amount>0?'in':'out'}">${ic(l.amount>0?'plus':'minus')}</div><div class="tm"><b>${l.amount>0?'Tambah':'Kurangi'} saldo</b><div class="meta"><span>${fd(l.date)}</span><span>${esc(wname(l.walletId))}</span></div>${l.note?`<small>${esc(l.note)}</small>`:''}</div><span class="amt ${l.amount>0?'in':'out'}">${l.amount>0?'+':'-'}${rp(Math.abs(l.amount))}</span><button class="x" onclick="delBal('${l.id}')">${ic('trash')}</button></div>`;
function openBal(id){
  if(!D.Wallets.length)return toast('Tambahkan Dompet/Rekening di Setting dulu');
  id=id||D.Wallets[0].id;
  modal(`<h3>Ubah Saldo</h3><label>Dompet/Rekening</label><select id="b_w" onchange="balInfo()">${D.Wallets.map(w=>`<option value="${w.id}" ${w.id==id?'selected':''}>${esc(w.name)}</option>`).join('')}</select>
  <label>Jenis</label><select id="b_m" onchange="balInfo()"><option value="1">Tambah saldo</option><option value="-1">Kurangi saldo</option></select>
  <label>Jumlah</label>${mi('b_a',0,'balInfo()')}<div class="info" id="b_i"></div>
  <label>Tanggal</label><input id="b_d" type="date" value="${today()}">
  <label>Catatan (opsional)</label><input id="b_n" placeholder="Contoh: setoran modal, tarik tunai"><button class="btn" onclick="saveBal()">Simpan</button>`);
  balInfo();
}
function balInfo(){
  const w=D.Wallets.find(x=>x.id==$('#b_w').value),b=bal(w),a=pv('b_a')*$('#b_m').value,n=b+a;
  $('#b_i').innerHTML='Saldo saat ini: '+rp(b)+(a?' → setelah: <b>'+rp(n)+'</b>':'');$('#b_i').style.color=n<0?'var(--out)':'';
}
async function saveBal(){
  const w=D.Wallets.find(x=>x.id==$('#b_w').value),m=+$('#b_m').value,a=pv('b_a');
  if(!(a>0))return toast('Jumlah wajib diisi');
  if(!$('#b_d').value)return toast('Tanggal wajib diisi');
  const b=bal(w);if(m<0&&a>b)return toast(`Saldo ${w.name} tidak mencukupi (tersedia ${rp(b)})`);
  try{
    const row={date:$('#b_d').value,walletId:w.id,wallet:w.name,amount:m*a,note:$('#b_n').value};
    D.BalanceLog.push((await api('add',{t:'BalanceLog',row})).row);closeM();render();toast('Saldo diperbarui');
  }catch(e){toast(e.message)}
}
async function delBal(id){
  const l=D.BalanceLog.find(x=>x.id==id),w=l&&D.Wallets.find(x=>x.id==l.walletId);
  if(w&&l.amount>0&&bal(w)-l.amount<0)return toast('Tidak dapat dihapus: saldo '+w.name+' akan menjadi negatif');
  if(!confirm('Hapus catatan ini? Saldo dompet akan menyesuaikan kembali.'))return;
  try{await api('del',{t:'BalanceLog',id});D.BalanceLog=D.BalanceLog.filter(x=>x.id!=id);render()}catch(e){toast(e.message)}
}
async function saveAdj(k,id){
  const it=D[k].find(x=>x.id==id),q=+$('#j_q').value;
  if(!(q>0))return toast('Jumlah wajib diisi');
  const row={date:$('#j_d').value||today(),kind:k,itemId:id,item:it.name,qty:q*$('#j_m').value,note:$('#j_n').value};
  try{D.StockLog.push((await api('add',{t:'StockLog',row})).row);closeM();render();toast('Stok diperbarui')}catch(e){toast(e.message)}
}

// ---------- PDF ----------
function pdf(){
  if(!window.jspdf)return toast('Library PDF belum termuat, coba lagi');
  const[a,b]=rng(P.rep),t=txs(P.rep).reverse(),i=sum(t.filter(x=>x.in)),o=sum(t.filter(x=>!x.in));
  const d=new window.jspdf.jsPDF();
  d.setFontSize(14);d.text('MyPOS - Laporan Keuangan',14,15);d.setFontSize(10);d.text(`Periode: ${fd(a)} s/d ${fd(b)}`,14,22);
  d.autoTable({startY:27,styles:{fontSize:7.5},headStyles:{fillColor:[15,118,110]},
    head:[['Tanggal','Kode','Jenis','Keterangan','Qty','Masuk','Keluar']],
    body:t.map(x=>[fd(x.date),code(x),x.k,iname(x),nf(x.qty),x.in?rp(x.total):'',x.in?'':rp(x.total)]),
    foot:[['','','','Total','',rp(i),rp(o)],['','','','Selisih saldo','',rp(i-o),'']],footStyles:{fillColor:[230,240,238],textColor:20}});
  d.save(`mypos_laporan_${a}_${b}.pdf`);
}

// ---------- tombol Kembali (navigation bar HP) & Enter keyboard ----------
history.replaceState({v:view},'');
addEventListener('popstate',e=>{
  if(modalOpen())return hideM();
  const v=e.state&&e.state.v;if(v&&v!=view){view=v;render()}
});
const scope=t=>t.closest('#mb,.auth,.acc .ab')||document;
const fields=sc=>[...sc.querySelectorAll('input,select,textarea')].filter(x=>!x.disabled&&x.offsetParent);
document.addEventListener('focusin',e=>{
  const t=e.target;if(!t.matches||!t.matches('input,select'))return;
  const sc=scope(t);if(sc===document)return;
  const f=fields(sc);t.enterKeyHint=f.indexOf(t)<f.length-1?'next':'go';
});
document.addEventListener('keydown',e=>{
  if(e.key=='Escape'&&modalOpen())return closeM();
  if(e.key!='Enter'||!e.target.matches||!e.target.matches('input'))return;
  const sc=scope(e.target);if(sc===document)return;
  e.preventDefault();
  const f=fields(sc),i=f.indexOf(e.target);
  if(i>=0&&i<f.length-1)f[i+1].focus();else{const b=sc.querySelector('.btn');if(b)b.click()}
});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();if(tok)sync();
</script></body></html>
