<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,sans-serif}

.big{font-size:28px;font-weight:800;letter-spacing:-.6px}

label{font-size:12px;color:var(--mut);font-weight:600}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--g);color:#fff;font-weight:700;box-shadow:0 8px 18px -8px #0f766ecc}

nav button.on{color:var(--pri);background:var(--bg2);font-weight:700}

.brand{display:none}

 nav{left:0;top:0;bottom:0;right:auto;width:220px;flex-direction:column;border-radius:0;border-width:0 1px 0 0;padding:20px 12px;gap:4px;justify-content:flex-start}

 .fab{bottom:28px}main{padding-bottom:100px}
}

.st{display:flex;align-items:center;gap:12px}

.av .i{width:20px;height:20px}

.fab{display:flex;align-items:center;justify-content:center;gap:6px}
.fab .i{width:26px;height:26px;stroke-width:2.2}
.fab:has(.i + span){padding:0 22px}
main>.seg+.card,.dg{margin-top:0}
.hero>*{position:relative;z-index:1}
.db .big{font-size:30px;margin:14px 0 14px}
.db .eye{background:#ffffff26;border:0;color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.inbox{background:#ffffff1f;border:1px solid #ffffff33;border-radius:16px;padding:12px 14px}
.inbox .two{display:flex;gap:12px;margin-top:10px;align-items:center}

.hero .ib.in{background:#4ade8033;color:#bbf7d0}.hero .ib.out{background:#f8717140;color:#fecaca}

.wl{font-size:12px;opacity:.85;margin-top:14px}
.wa{font-weight:800;font-size:16px;letter-spacing:-.3px;position:relative;z-index:1}
.wd{position:absolute;right:-8px;bottom:-10px;opacity:.16}.wd .i{width:64px;height:64px;stroke-width:1.5}
.ck{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#ffffff40}.ck .i{width:12px;height:12px;stroke-width:3}
.lnk{color:var(--pri);font-weight:600;font-size:13px;text-decoration:none}
a.more{display:block;padding:10px 0 4px;text-align:center;color:var(--pri);font-weight:600;font-size:13px;text-decoration:none}
.acc summary.sm{padding:14px;font-weight:400}
.acc summary .tm b{font-weight:700}
textarea{width:100%;padding:12px 13px;margin:4px 0 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;outline:0;resize:vertical}
textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px #14b8a62e}
.seg button{font-size:12.5px;padding:9px 2px}
.btn.alt{background:var(--bg2);color:var(--tx);box-shadow:none}
.btn .i{margin-right:6px;vertical-align:-4px}
.lgp{width:72px;height:72px;border-radius:16px;background:var(--bg2);display:grid;place-items:center;overflow:hidden;flex:none}

.inv th{background:#f1f5f4}.inv .r{text-align:right}

const API='https://script.google.com/macros/s/AKfycbyBTJy0MxaKClRbe5s16WpdvlcCcvxJ00fl6JyglyjJVGlbqH2BlkzQtoH7oXWb43H-9g/exec'; // <- URL deployment Apps Script (berakhiran /exec)

const grp=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,'.');

async function api(a,o={}){
  if(API.startsWith('PASTE'))throw new Error('API belum diisi di index.html');
  const r=await fetch(API,{method:'POST',body:JSON.stringify({a,token:tok,...o})});
  const j=await r.json();
  if(!j.ok){if(/sesi/i.test(j.error))logout();throw new Error(/tidak dapat diedit|Tabel tidak valid|Aksi tidak dikenal/.test(j.error)?'Backend belum versi terbaru: tempel ulang Code.gs lalu Deploy → New version':j.error)}
  return j;
}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
const modalOpen=()=>$('#md').style.display=='flex';

function hideM(){$('#md').style.display='none';HK=null;HW=null;PAYID=null;DEBTID=null}

// ---------- periode ----------
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function rng(p){
  const t=today(),pad=n=>String(n).padStart(2,'0');
  if(p.m=='range')return[p.from||'0000-01-01',p.to||'9999-12-31'];
  if(p.m=='week'){const e=new Date(),b=new Date();b.setDate(e.getDate()-6);return[ymd(b),ymd(e)]}
  const m=(p.m=='month'&&p.month)||t.slice(0,7);
  return[m+'-01',m+'-'+pad(new Date(m.slice(0,4),m.slice(5),0).getDate())];
}
const inR=(x,p)=>{const[a,b]=rng(p);return x.date>=a&&x.date<=b};
function periodUI(k){
  const p=P[k],c=(v,l)=>`<button class="${p.m==v?'on':''}" onclick="setP('${k}','m','${v}')">${l}</button>`;
  return `<div class="seg">${k=='dash'?c('this','Bulan ini'):c('week','Minggu ini')}${c('month','Pilih bulan')}${c('range','Rentang')}</div>`+
  (p.m=='month'?`<input type="month" value="${p.month||today().slice(0,7)}" onchange="setP('${k}','month',this.value)">`:'')+
  (p.m=='range'?`<div class="g2" style="margin-bottom:0"><div><label>Tanggal awal</label><input type="date" value="${p.from||''}" ${p.to?`max="${p.to}"`:''} onchange="setP('${k}','from',this.value)"></div><div><label>Tanggal akhir</label><input type="date" value="${p.to||''}" ${p.from?`min="${p.from}"`:''} onchange="setP('${k}','to',this.value)"></div></div>`:'');
}
function setP(k,f,v){
  const p=P[k];
  if(f=='from'&&v&&p.to&&v>p.to){toast('Tanggal awal tidak boleh lebih besar dari tanggal akhir');return render()}
  if(f=='to'&&v&&p.from&&v<p.from){toast('Tanggal akhir tidak boleh lebih kecil dari tanggal awal');return render()}
  p[f]=v;if(f=='m'&&v=='month'&&!p.month)p.month=today().slice(0,7);render();
}

// ---------- data & stok ----------
const sum=a=>a.reduce((x,s)=>x+ +s.total,0);
const wname=id=>(D.Wallets.find(w=>w.id==id)||{name:'(terhapus)'}).name;
const bal=w=>(+w.initial||0)+sum(D.Sales.filter(s=>s.status!='Piutang'&&s.walletId==w.id))+validPays().filter(p=>p.walletId==w.id).reduce((a,p)=>a+ +p.amount,0)-sum(D.Purchases.filter(s=>!isDb(s)&&s.walletId==w.id))-validDP().filter(d=>d.walletId==w.id).reduce((a,d)=>a+ +d.amount,0)+D.BalanceLog.filter(l=>l.walletId==w.id).reduce((a,l)=>a+ +l.amount,0);
function stk(k,it){
  const adj=D.StockLog.filter(l=>l.kind==k&&l.itemId==it.id).reduce((a,l)=>a+ +l.qty,0);
  const mv=(k=='Products'?D.Sales:D.Purchases).filter(x=>x.itemId==it.id).reduce((a,x)=>a+ +x.qty,0);
  const init=+it.stock||0;
  return{init,adj,mv,cur:init+adj+(k=='Products'?-mv:mv)};
}
const isLow=(k,it)=>stk(k,it).cur<=(+it.min||0);
function txs(p){
  const all=[...D.Sales.map(s=>({...s,k:'Penjualan',in:1})),...D.Purchases.map(s=>({...s,k:'Pembelian',in:0}))];
  return(p?all.filter(x=>inR(x,p)):all).sort((a,b)=>b.date.localeCompare(a.date));
}
const isCr=s=>s.status=='Piutang'||!String(s.walletId??'').trim(); // penjualan tanpa dompet = belum dibayar
const isDb=p=>p.status=='Utang'||!String(p.walletId??'').trim(); // pembelian tanpa dompet = belum dibayar
const validDP=()=>{const ids=new Set(D.Purchases.map(p=>p.id));return D.DebtPayments.filter(d=>ids.has(d.purchaseId))};
const paidAmtB=p=>isDb(p)?D.DebtPayments.filter(d=>d.purchaseId==p.id).reduce((a,d)=>a+ +d.amount,0):+p.total;
const restB=p=>Math.max(0,(+p.total)-paidAmtB(p));
const stTB=p=>!isDb(p)||restB(p)<=0?'Lunas':paidAmtB(p)>0?'Cicil':'Utang';
const cashBuys=()=>[
  ...D.Purchases.filter(p=>!isDb(p)).map(p=>({...p,sd:p.date})),
  ...validDP().map(d=>{const p=D.Purchases.find(x=>x.id==d.purchaseId);return{...p,sd:p.date,date:d.date,total:+d.amount,walletId:d.walletId,pay:1}})
];
const validPays=()=>{const ids=new Set(D.Sales.map(s=>s.id));return D.Payments.filter(p=>ids.has(p.saleId))};
const paidAmt=s=>isCr(s)?D.Payments.filter(p=>p.saleId==s.id).reduce((a,p)=>a+ +p.amount,0):+s.total;
const rest=s=>Math.max(0,(+s.total)-paidAmt(s));
const isPaid=s=>rest(s)<=0;
const stT=s=>!isCr(s)||rest(s)<=0?'Lunas':paidAmt(s)>0?'Cicil':'Piutang';
const cashSales=()=>[
  ...D.Sales.filter(s=>!isCr(s)).map(s=>({...s,sd:s.date,date:s.paidDate||s.date})),
  ...validPays().map(p=>{const s=D.Sales.find(x=>x.id==p.saleId);return{...s,sd:s.date,date:p.date,total:+p.amount,walletId:p.walletId,pay:1}})
];
const repTx=p=>[
  ...cashSales().filter(x=>inR(x,p)).map(s=>({...s,k:s.pay?'Pembayaran Piutang':'Penjualan',in:1})),
  ...D.Sales.filter(s=>isCr(s)&&rest(s)>0&&inR(s,p)).map(s=>({...s,k:'Piutang',in:1,due:1,rest:rest(s)})),
  ...cashBuys().filter(x=>inR(x,p)).map(s=>({...s,k:s.pay?'Pembayaran Utang':'Pembelian',in:0})),
  ...D.Purchases.filter(s=>isDb(s)&&restB(s)>0&&inR(s,p)).map(s=>({...s,k:'Utang',in:0,due:1,rest:restB(s)}))
].sort((a,b)=>b.date.localeCompare(a.date));
const code=x=>(x.in?'PJ':'PB')+'-'+(x.sd||x.date).replace(/-/g,'').slice(2)+'-'+String(x.id).slice(0,4).toUpperCase();
const iname=x=>((x.in?D.Products:D.Materials).find(i=>i.id==x.itemId)||{}).name||x.item;
const txRow=(x,del)=>{
  const S=!!x.in,cr=S?isCr(x):isDb(x),pd=cr?(S?paidAmt(x):paidAmtB(x)):0,rs=cr?(S?rest(x):restB(x)):0,id='t'+x.id;
  const st=S?stT(x):stTB(x),chip=`<span class="chip ${st=='Lunas'?'ok':'due'}">${st}</span>`;
  const kv=(k,v)=>`<div class="kv"><span>${k}</span><span>${v}</span></div>`;
  const pay=cr?(pd>0?'Dibayar '+rp(pd)+' · Sisa '+rp(rs):'Belum dibayar · Sisa '+rp(rs)):esc(wname(x.walletId));
  const acts=del?`<div class="acts">${cr?`<button class="btn sm" onclick="${S?'openPay':'openDebt'}('${x.id}')">${rs>0?(S?'Terima Pembayaran':'Bayar Utang'):'Lihat Pembayaran'}</button>`:''}${S?`<button class="btn sm alt" onclick="openInvoice('${x.id}')">${ic('print')} Invoice</button>`:''}<button class="btn sm alt dng" onclick="del('${del}','${x.id}')">${ic('trash')} Hapus</button></div>`:'';
  const body=`<div class="dt">${kv('Kode',`<span class="code">${code(x)}</span>`)}${kv('Tanggal',fd(x.date))}${kv(cr?'Pembayaran':(S?'Masuk ke':'Dibayar dari'),pay)}${kv('Rincian',nf(x.qty)+' × '+rp(x.price))}${x.note?kv('Catatan',esc(x.note)):''}${acts}</div>`;
  return `<details class="dr" ${OPEN[id]?'open':''} ontoggle="OPEN['${id}']=this.open"><summary><div class="av ${S?'in':'out'}">${ic(S?'down':'up')}</div><div class="tm"><b>${esc(iname(x))}</b><small>${fd(x.date)} · ${chip}</small></div><span class="amt ${st=='Lunas'?(S?'in':'out'):'dueamt'}">${S?'+':'-'}${rp(x.total)}</span></summary>${body}</details>`;
};

  dash(){
    const p=P.dash;
    if(dw!='all'&&!D.Wallets.some(w=>w.id==dw))dw='all';

    <div class="st" style="justify-content:space-between;margin:6px 2px 8px"><b>Dompet & Rekening</b><span><a href="#" class="lnk" onclick="openBal('${dw=='all'?'':dw}');return false">± Kelola Saldo</a><a href="#" class="lnk" style="margin-left:16px" onclick="stab='Wallets';go('set');return false">Kelola</a></span></div>
    <div class="ws">${wc('all','Semua','layers',all,'#0f766e,#14b8a6',dw=='all')}${D.Wallets.map((w,n)=>wc(w.id,w.name,w.type=='Rekening'?'bank':'wallet',bal(w),WP[n%WP.length],dw==w.id)).join('')}</div>
    ${acc('last10',ic('clock')+' 10 Transaksi Terakhir',last.map(x=>txRow(x)).join('')||'<div class="mut">Belum ada transaksi.</div>',false)}`;
  },
  sales:()=>list('Sales'),
  buy:()=>list('Purchases'),
  stock(){
    const k=sk,items=D[k],low=items.filter(x=>isLow(k,x)).length;
    return `<div class="seg">${['Products','Materials'].map(t=>`<button class="${t==k?'on':''}" onclick="sk='${t}';render()">${NM[t]}</button>`).join('')}</div>
    <div class="g2"><div class="card"><div class="mut">Jumlah item</div><div class="big">${items.length}</div></div><div class="card"><div class="mut">Stok menipis</div><div class="big ${low?'out':''}">${low}</div></div></div>`+
    (items.map(x=>{
      const s=stk(k,x),lo=isLow(k,x),lg=logsOf(k,x.id);
      const sm=`<div class="ib ${lo?'out':'in'}">${ic('stock')}</div><div class="tm"><b>${esc(x.name)}</b><small>Awal ${nf(s.init)} · ${k=='Products'?'Terjual':'Dibeli'} ${nf(s.mv)} · Koreksi ${s.adj>0?'+':''}${nf(s.adj)}</small></div><span class="bdg ${lo?'out':'in'}">${nf(s.cur)}</span><button class="btn sm" onclick="event.preventDefault();event.stopPropagation();openAdj('${k}','${x.id}')">Atur</button>`;
      const b=lg.length?`<div class="mut" style="margin-bottom:2px">5 riwayat penyesuaian terakhir</div>${lg.slice(0,5).map(logRow).join('')}<a href="#" class="more" onclick="openHist('${k}','${x.id}');return false">Lihat Selengkapnya (${lg.length}) →</a>`:'<div class="mut" style="padding:2px 0 8px">Belum ada riwayat penyesuaian.</div>';
      return accI('sk'+x.id,sm,b);
    }).join('')||`<div class="card mut">Belum ada ${NM[k]}. Tambahkan di Setting.</div>`);
  },
  rep(){
    if(RT!='all')return repTabs()+repScreen();
    const t=repTx(P.rep),i=sum(t.filter(x=>x.in&&!x.due)),o=sum(t.filter(x=>!x.in&&!x.due)),pi=t.filter(x=>x.due&&x.in).reduce((a,x)=>a+x.rest,0),ut=t.filter(x=>x.due&&!x.in).reduce((a,x)=>a+x.rest,0);
    return repTabs()+periodUI('rep')+`<div class="g2">${stat('down','in','Penjualan (lunas)',rp(i))}${stat('up','out','Pembelian',rp(o))}</div>
    <div class="g2"><div class="card st"><div class="ib due">${ic('clock')}</div><div><div class="mut">Piutang</div><b class="dueamt">${rp(pi)}</b></div></div><div class="card st"><div class="ib due">${ic('clock')}</div><div><div class="mut">Utang</div><b class="dueamt">${rp(ut)}</b></div></div></div>
    <div class="card hero st"><div class="ib">${ic('flow')}</div><div><div class="mut">Selisih saldo</div><div class="big">${rp(i-o)}</div></div></div>

    <tr><th colspan=2>Total</th><th class="r">${rp(i)}</th><th class="r">${rp(o)}</th></tr></table></div>`;
  },
  set(){
    if(stab=='Store')return setSeg()+storeUI();
    const items=D[stab],w=stab=='Wallets';
    let f=`<label>Nama</label><input id="s_n">`;
    if(w)f+=`<label>Jenis</label><select id="s_t"><option>Dompet</option><option>Rekening</option></select><label>Saldo awal</label>${mi('s_p',0)}`;
    else f+=`<label>Harga satuan</label>${mi('s_p',0)}<div class="g2" style="margin:0"><div><label>Stok awal</label><input id="s_s" type="number" inputmode="decimal" value="0"></div><div><label>Stok minimum</label><input id="s_m" type="number" inputmode="decimal" value="0"></div></div>`;
    return `${setSeg()}
    ${acc('add'+stab,ic('plus')+' Tambah '+NM[stab],f+`<button class="btn" onclick="addSet()">Simpan</button>`,false)}
    ${w?walletList():`<div class="card"><h4>Daftar ${NM[stab]}</h4>${items.map(x=>`<div class="tx"><div class="ib">${ic(w?(x.type=='Rekening'?'bank':'wallet'):stab=='Products'?'tag':'stock')}</div><div class="tm"><b>${esc(x.name)}</b><small>${w?esc(x.type)+' · saldo '+rp(bal(x))+' (awal '+rp(x.initial)+')':rp(x.price)+' · stok awal '+nf(x.stock)+' · min '+nf(x.min)}</small></div>${w?`<button class="x" title="Ubah saldo" onclick="openBal('${x.id}')">${ic('flow')}</button>`:''}<button class="x" onclick="openEdit('${stab}','${x.id}')" title="Edit">${ic('edit')}</button><button class="x" onclick="del('${stab}','${x.id}')">${ic('trash')}</button></div>`).join('')||'<div class="mut">Belum ada data.</div>'}</div>`}`;
  }
};
function list(t){
  const S=t=='Sales',k=S?'sales':'buy',all=txs(P[k]).filter(x=>x.in==(S?1:0)),F=S?SF:SFB,nm=S?'SF':'SFB';
  const pa=S?paidAmt:paidAmtB,re=S?rest:restB;
  const r=F=='all'?all:all.filter(x=>F=='Lunas'?re(x)<=0:re(x)>0);
  const lu=all.reduce((a,x)=>a+pa(x),0),pi=sum(all)-lu;
  return periodUI(k)+`<div class="seg">${[['all','Semua'],['Lunas','Lunas'],['Due','Belum Bayar']].map(([v,l])=>`<button class="${F==v?'on':''}" onclick="${nm}='${v}';render()">${l}</button>`).join('')}</div>`+
  `<div class="card hero st"><div class="ib">${ic(S?'down':'up')}</div><div><div class="mut">Total ${S?'penjualan':'pembelian'}</div><div class="big">${rp(sum(all))}</div><div class="mut" style="margin-top:2px">Terbayar ${rp(lu)} · ${S?'Piutang':'Utang'} ${rp(pi)}</div></div></div>
  <div class="card">${r.map(x=>txRow(x,t)).join('')||'<div class="mut">Tidak ada transaksi pada periode ini.</div>'}</div>`;
}

  $('#app').innerHTML=`<div class="content"><header><div class="logo h"><i>M</i>MyPOS</div><button class="me" onclick="if(confirm('Keluar dari akun?'))logout()"><b>${esc(user[0])}</b>Keluar</button></header><main><h1><span class="ib">${ic(view)}</span>${T[view]}</h1>${STALE?'<div class="card" style="border-color:#d97706;color:#d97706"><b>Backend belum versi terbaru.</b> Tempel ulang Code.gs di Apps Script lalu Deploy → New version. Sebelum itu, status piutang dan pembayaran bisa tidak tersimpan.</div>':''}${V[view]()}</main></div>${fab}<nav><div class="brand"><div class="logo"><i>M</i>MyPOS</div></div>${Object.keys(T).map(k=>`<button class="${k==view?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${IC[k]}</svg><span>${T[k]}</span></button>`).join('')}</nav>`;
}

function authUI(){

function calc(){
  const tot=($('#f_q').value||0)*pv('f_p'),cr=$('#f_st')&&$('#f_st').value!='Lunas',dp=cr?pv('f_dp'):0,now=cr?dp:tot;
  $('#f_t').textContent='Total: '+rp(tot)+(cr?' · DP '+rp(dp)+' · Sisa '+rp(tot-dp):'');
  if(FT=='Purchases'){const w=D.Wallets.find(x=>x.id==$('#f_w').value),b=w?bal(w):0,bad=now>b;
    $('#f_b').textContent=now>0?'Saldo tersedia: '+rp(b)+(bad?' (tidak mencukupi)':''):'';$('#f_b').style.color=bad?'var(--out)':''}

async function save(){
  const t=FT,S=t=='Sales',k=S?'Products':'Materials',it=D[k].find(x=>x.id==$('#f_i').value),q=+$('#f_q').value,p=pv('f_p'),tot=q*p;
  const stt=$('#f_st').value,cr=stt!='Lunas',dp=cr?pv('f_dp'):0,w=D.Wallets.find(x=>x.id==$('#f_w').value);
  if(!$('#f_d').value||!(q>0))return toast('Tanggal dan jumlah wajib diisi');
  if(cr&&dp>0&&dp>=tot)return toast('DP harus lebih kecil dari total. Untuk bayar penuh pilih status Lunas');
  if(S){
    const cur=stk(k,it).cur;
    if(cur<=0)return toast(`Stok ${it.name} habis, penjualan tidak dapat dilakukan`);
    if(q>cur)return toast(`Stok ${it.name} tidak cukup (tersisa ${nf(cur)})`);
  }else{
    const now=cr?dp:tot;
    if(now>0&&now>bal(w))return toast(`Saldo ${w.name} tidak mencukupi (tersedia ${rp(bal(w))})`);
  }
  try{
    const row={date:$('#f_d').value,itemId:it.id,item:it.name,qty:q,price:p,total:tot,walletId:cr?'':w.id,note:$('#f_n').value,status:stt,paidDate:cr?'':$('#f_d').value};
    const nr=(await api('add',{t,row})).row;D[t].push(nr);
    let err='';
    if(cr&&dp>0){try{const tb=S?'Payments':'DebtPayments',r2={date:row.date,walletId:w.id,amount:dp,note:'DP'};r2[S?'saleId':'purchaseId']=nr.id;D[tb].push((await api('add',{t:tb,row:r2})).row)}catch(e){err=e.message}}
    render();if(S)openInvoice(nr.id);else closeM();
    toast(err?'Transaksi tersimpan, tetapi DP gagal dicatat ('+err+'). Catat lewat menu pembayaran.':'Tersimpan, stok & saldo diperbarui');
  }catch(e){toast(e.message)}
}
async function del(t,id){
  if(!confirm('Hapus data ini?'+(t=='Sales'||t=='Purchases'?' Stok & saldo akan menyesuaikan kembali.':'')))return;
  try{await api('del',{t,id});D[t]=D[t].filter(x=>x.id!=id);if(t=='Sales'){for(const p of D.Payments.filter(p=>p.saleId==id))await api('del',{t:'Payments',id:p.id});D.Payments=D.Payments.filter(p=>p.saleId!=id)}if(t=='Purchases'){for(const p of D.DebtPayments.filter(p=>p.purchaseId==id))await api('del',{t:'DebtPayments',id:p.id});D.DebtPayments=D.DebtPayments.filter(p=>p.purchaseId!=id)}render()}catch(e){toast(e.message)}
}

function readLogo(inp){
  const f=inp.files[0];if(!f)return;
  if(!/^image\//.test(f.type))return toast('File harus berupa gambar');
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,400/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const mime=f.type=='image/jpeg'?'image/jpeg':'image/png',u=c.toDataURL(mime,.9);
    LG={data:u.split(',')[1],mime};$('#lgp').innerHTML=`<img src="${u}" alt="">`;
  };im.onerror=()=>toast('Gambar tidak dapat dibaca');im.src=rd.result};
  rd.readAsDataURL(f);
}

  <div class="iv2"><div><b>INVOICE</b><div class="sx">No: ${code(x)}</div></div><div class="sx" style="text-align:right">Tanggal: ${fd(x.date)}<br>Kasir: ${esc(user)}</div></div>
  <table><tr><th>Item</th><th class="r">Qty</th><th class="r">Harga</th><th class="r">Subtotal</th></tr><tr><td>${esc(iname(x))}</td><td class="r">${nf(x.qty)}</td><td class="r">${rp(x.price)}</td><td class="r">${rp(x.total)}</td></tr></table>
  <div class="tt"><span>TOTAL</span><span>${rp(x.total)}</span></div>
  <div class="pay"><div class="pr"><span>Sudah dibayar</span><b>${rp(paid)}</b></div><div class="pr"><span>Belum dibayar</span><b class="${sisa>0?'bad':''}">${rp(sisa)}</b></div>
  <div class="stt ${sisa>0?'bad':'ok'}">${sisa>0?(paid>0?'BELUM LUNAS (DP / CICIL)':'BELUM LUNAS'):'LUNAS'}</div></div>
  <div class="pl">${cr?(ps.length?'<b>Rincian pembayaran</b><br>'+ps.map(d=>fd(d.date)+' · '+esc(wname(d.walletId))+(d.note?' ('+esc(d.note)+')':'')+' · '+rp(d.amount)).join('<br>'):'Belum ada pembayaran'):'Dibayar ke: '+esc(wname(x.walletId))}${x.note?'<br>Catatan: '+esc(x.note):''}</div>
  ${st.note?`<div class="ft">${nl(st.note)}</div>`:''}<div class="ft">Terima kasih atas kunjungan Anda</div></div>`;

function openInvoice(id){
  const s=D.Sales.find(x=>x.id==id);if(!s)return;INV=id;
  modal(`<div class="noprint"><h3>Invoice</h3><div class="seg"><button class="${PAPER=='A4'?'on':''}" onclick="setPaper('A4')">A4</button><button class="${PAPER=='rc'?'on':''}" onclick="setPaper('rc')">Struk 80mm</button></div></div>${invHTML({...s,in:1})}
  <div class="noprint" style="margin-top:14px">${getStore().name?'':'<div class="mut" style="margin-bottom:8px">Isi identitas toko di Setting → Toko agar nama, alamat & logo tampil.</div>'}<button class="btn" onclick="printInv()">${ic('print')} Cetak Invoice</button><button class="btn alt" style="margin-top:8px" onclick="closeM()">Tutup</button></div>`);
}
function setPaper(p){PAPER=p;localStorage.paper=p;openInvoice(INV)}
function printInv(){$('#pg').textContent=PAPER=='rc'?'@page{size:80mm auto;margin:3mm}':'@page{size:A4;margin:14mm}';setTimeout(()=>window.print(),60)}
const wMoves=w=>[
  ...validPays().filter(p=>p.walletId==w.id).map(p=>{const s=D.Sales.find(x=>x.id==p.saleId);return{t:'pay',id:p.id,date:p.date,amt:+p.amount,title:'Pembayaran piutang',sub:iname({...s,in:1}),code:code({...s,in:1})}}),
  ...D.Sales.filter(s=>s.status!='Piutang'&&s.walletId==w.id).map(s=>({t:'sale',id:s.id,date:s.paidDate||s.date,amt:+s.total,title:'Penjualan',sub:iname({...s,in:1}),code:code({...s,in:1})})),
  ...validDP().filter(d=>d.walletId==w.id).map(d=>{const p=D.Purchases.find(x=>x.id==d.purchaseId);return{t:'dpay',id:d.id,date:d.date,amt:-d.amount,title:'Pembayaran utang',sub:iname({...p,in:0}),code:code({...p,in:0})}}),
  ...D.Purchases.filter(s=>!isDb(s)&&s.walletId==w.id).map(s=>({t:'buy',id:s.id,date:s.date,amt:-s.total,title:'Pembelian',sub:iname({...s,in:0}),code:code({...s,in:0})})),
  ...D.BalanceLog.filter(l=>l.walletId==w.id).map(l=>({t:'adj',id:l.id,date:l.date,amt:+l.amount,title:l.ref?(l.amount>0?'Transfer masuk':'Transfer keluar'):(l.amount>0?'Tambah saldo':'Kurangi saldo'),sub:l.note}))
].reverse().sort((a,b)=>b.date.localeCompare(a.date));
const moveRow=m=>`<div class="tx"><div class="av ${m.amt>0?'in':'out'}">${ic(m.t=='sale'?'down':m.t=='buy'?'up':(m.amt>0?'plus':'minus'))}</div><div class="tm"><b>${m.title}</b><div class="meta">${m.code?`<span class="code">${m.code}</span>`:''}<span>${fd(m.date)}</span></div>${m.sub?`<small>${esc(m.sub)}</small>`:''}</div><span class="amt ${m.amt>0?'in':'out'}">${m.amt>0?'+':'-'}${rp(Math.abs(m.amt))}</span>${m.t=='adj'?`<button class="x" onclick="delBal('${m.id}')">${ic('trash')}</button>`:m.t=='pay'?`<button class="x" onclick="delPay('${m.id}')">${ic('trash')}</button>`:m.t=='dpay'?`<button class="x" onclick="delDebtPay('${m.id}')">${ic('trash')}</button>`:''}</div>`;
function walletList(){
  if(!D.Wallets.length)return '<div class="card mut">Belum ada Dompet/Rekening. Tambahkan lewat form di atas.</div>';
  return D.Wallets.map(x=>{
    const b=bal(x),mv=wMoves(x),init=+x.initial||0,sa=sum(D.Sales.filter(s=>s.status!='Piutang'&&s.walletId==x.id))+validPays().filter(p=>p.walletId==x.id).reduce((a,p)=>a+ +p.amount,0),pu=sum(D.Purchases.filter(s=>!isDb(s)&&s.walletId==x.id))+validDP().filter(d=>d.walletId==x.id).reduce((a,d)=>a+ +d.amount,0),adj=D.BalanceLog.filter(l=>l.walletId==x.id).reduce((a,l)=>a+ +l.amount,0);
    const sm=`<div class="ib">${ic(x.type=='Rekening'?'bank':'wallet')}</div><div class="tm"><b>${esc(x.name)}</b><small>${esc(x.type)}</small></div><span class="bdg ${b<0?'out':'in'}" style="white-space:nowrap">${rp(b)}</span>`;
    const body=`<div class="mut" style="margin:0 0 10px">Awal ${rp(init)} · Penjualan +${rp(sa)} · Pembelian -${rp(pu)} · Penyesuaian ${adj<0?'-':'+'}${rp(Math.abs(adj))}</div>
    <div class="acts"><button class="btn sm" onclick="openBal('${x.id}')">± Kelola Saldo</button><button class="btn sm alt" onclick="openEdit('Wallets','${x.id}')">Edit</button><button class="btn sm alt dng" onclick="del('Wallets','${x.id}')">Hapus</button></div>`+
    (mv.length?`<div class="mut" style="margin:6px 0 2px">5 riwayat perubahan saldo terakhir</div>${mv.slice(0,5).map(moveRow).join('')}<a href="#" class="more" onclick="openWHist('${x.id}');return false">Lihat Selengkapnya (${mv.length}) →</a>`:'<div class="mut" style="padding:2px 0 8px">Belum ada perubahan saldo.</div>');
    return accI('wl'+x.id,sm,body);
  }).join('');
}
function openWHist(id){
  HW=id;const w=D.Wallets.find(x=>x.id==id),mv=wMoves(w);
  modal(`<h3>Riwayat Saldo</h3><p class="mut" style="margin-top:0">${esc(w.name)} · saldo akhir <b>${rp(bal(w))}</b> · ${mv.length} catatan</p>${mv.map(moveRow).join('')||'<div class="mut">Belum ada riwayat.</div>'}`);
}
const balRow=l=>`<div class="tx"><div class="av ${l.amount>0?'in':'out'}">${ic(l.amount>0?'plus':'minus')}</div><div class="tm"><b>${l.amount>0?'Tambah':'Kurangi'} saldo</b><div class="meta"><span>${fd(l.date)}</span><span>${esc(wname(l.walletId))}</span></div>${l.note?`<small>${esc(l.note)}</small>`:''}</div><span class="amt ${l.amount>0?'in':'out'}">${l.amount>0?'+':'-'}${rp(Math.abs(l.amount))}</span><button class="x" onclick="delBal('${l.id}')">${ic('trash')}</button></div>`;
function openBal(id){
  if(!D.Wallets.length)return toast('Tambahkan Dompet/Rekening di Setting dulu');
  id=id||D.Wallets[0].id;
  modal(`<h3>Kelola Saldo</h3><label>Dompet/Rekening</label><select id="b_w" onchange="balInfo()">${D.Wallets.map(w=>`<option value="${w.id}" ${w.id==id?'selected':''}>${esc(w.name)}</option>`).join('')}</select>
  <label>Jenis</label><select id="b_m" onchange="balInfo()"><option value="1">Tambah saldo</option><option value="-1">Kurangi saldo</option>${D.Wallets.length>1?'<option value="T">Transfer ke dompet lain</option>':''}</select><div id="b_tb" style="display:none"><label>Ke dompet/rekening</label><select id="b_t" onchange="balInfo()"></select></div>
  <label>Jumlah</label>${mi('b_a',0,'balInfo()')}<div class="info" id="b_i"></div>
  <label>Tanggal</label><input id="b_d" type="date" value="${today()}">
  <label>Catatan (opsional)</label><input id="b_n" placeholder="Contoh: setoran modal, tarik tunai"><button class="btn" onclick="saveBal()">Simpan</button>`);
  balInfo();
}
function balInfo(){
  const w=D.Wallets.find(x=>x.id==$('#b_w').value),b=bal(w),m=$('#b_m').value,a=pv('b_a'),tb=$('#b_tb');
  let extra='',n;
  if(m=='T'){
    tb.style.display='';const sel=$('#b_t'),cur=sel.value;
    sel.innerHTML=D.Wallets.filter(x=>x.id!=w.id).map(x=>`<option value="${x.id}" ${x.id==cur?'selected':''}>${esc(x.name)} · ${rp(bal(x))}</option>`).join('');
    const to=D.Wallets.find(x=>x.id==sel.value);n=b-a;
    if(a&&to)extra=' · '+esc(to.name)+' → <b>'+rp(bal(to)+a)+'</b>';
  }else{tb.style.display='none';n=b+a*m}
  $('#b_i').innerHTML=esc(w.name)+': '+rp(b)+(a?' → setelah: <b>'+rp(n)+'</b>':'')+extra;$('#b_i').style.color=n<0?'var(--out)':'';
}
async function saveBal(){
  const w=D.Wallets.find(x=>x.id==$('#b_w').value),m=$('#b_m').value,a=pv('b_a'),b=bal(w),d=$('#b_d').value,nt=$('#b_n').value;
  if(!(a>0))return toast('Jumlah wajib diisi');
  if(!d)return toast('Tanggal wajib diisi');
  if(m=='T'){
    const to=D.Wallets.find(x=>x.id==$('#b_t').value);
    if(!to)return toast('Pilih dompet tujuan');
    if(a>b)return toast(`Saldo ${w.name} tidak mencukupi (tersedia ${rp(b)})`);
    const ref='t'+Date.now().toString(36);
    try{
      const r1=(await api('add',{t:'BalanceLog',row:{date:d,walletId:w.id,wallet:w.name,amount:-a,note:'Transfer ke '+to.name+(nt?' · '+nt:''),ref}})).row;
      D.BalanceLog.push(r1);
      try{D.BalanceLog.push((await api('add',{t:'BalanceLog',row:{date:d,walletId:to.id,wallet:to.name,amount:a,note:'Transfer dari '+w.name+(nt?' · '+nt:''),ref}})).row)}
      catch(e2){try{await api('del',{t:'BalanceLog',id:r1.id})}catch(_){}D.BalanceLog=D.BalanceLog.filter(x=>x.id!=r1.id);throw e2}
      closeM();render();toast('Transfer berhasil');
    }catch(e){toast(e.message)}
    return;
  }
  if(m=='-1'&&a>b)return toast(`Saldo ${w.name} tidak mencukupi (tersedia ${rp(b)})`);
  try{
    const row={date:d,walletId:w.id,wallet:w.name,amount:(+m)*a,note:nt};
    D.BalanceLog.push((await api('add',{t:'BalanceLog',row})).row);closeM();render();toast('Saldo diperbarui');
  }catch(e){toast(e.message)}
}
async function delBal(id){
  const l=D.BalanceLog.find(x=>x.id==id);if(!l)return;
  const legs=l.ref?D.BalanceLog.filter(x=>x.ref==l.ref):[l];
  for(const g of legs){const w=D.Wallets.find(x=>x.id==g.walletId);
    if(w&&g.amount>0&&bal(w)-g.amount<0)return toast('Tidak dapat dihapus: saldo '+w.name+' akan menjadi negatif')}
  if(!confirm(l.ref?'Hapus transfer ini? Kedua catatan (dompet asal & tujuan) akan dihapus.':'Hapus catatan ini? Saldo dompet akan menyesuaikan kembali.'))return;
  const h=HW;
  try{for(const g of legs){await api('del',{t:'BalanceLog',id:g.id});D.BalanceLog=D.BalanceLog.filter(x=>x.id!=g.id)}render();if(h&&modalOpen())openWHist(h)}catch(e){toast(e.message);render()}
}
async function saveAdj(k,id){
  const it=D[k].find(x=>x.id==id),q=+$('#j_q').value;
  if(!(q>0))return toast('Jumlah wajib diisi');
  const row={date:$('#j_d').value||today(),kind:k,itemId:id,item:it.name,qty:q*$('#j_m').value,note:$('#j_n').value};
  try{D.StockLog.push((await api('add',{t:'StockLog',row})).row);closeM();render();toast('Stok diperbarui')}catch(e){toast(e.message)}
}

// ---------- PDF ----------
const perLabel=p=>{const[a,b]=rng(p);if(p.m=='range'){if(!p.from&&!p.to)return 'Semua tanggal';return(p.from?fd(p.from):'Awal')+' s/d '+(p.to?fd(p.to):'Sekarang')}return fd(a)+' s/d '+fd(b)};
function repData(type){
  const p=P.rep,[a,b]=rng(p),per=perLabel(p);
  if(type=='sales'||type=='buys'){
    const S=type=='sales',src=S?D.Sales:D.Purchases,pa=S?paidAmt:paidAmtB,re=S?rest:restB,stf=S?stT:stTB;
    const rows=src.filter(x=>inR(x,p)).sort((x,y)=>x.date.localeCompare(y.date)).map(x=>({...x,in:S?1:0}));
    const T=sum(rows),Pd=rows.reduce((q,x)=>q+pa(x),0),Q=rows.reduce((q,x)=>q+ +x.qty,0),g={};
    rows.forEach(x=>{const n=iname(x);g[n]=g[n]||{q:0,t:0};g[n].q+=+x.qty;g[n].t+=+x.total});
    const rk=Object.entries(g).sort((x,y)=>y[1].t-x[1].t);
    return{title:S?'Laporan Penjualan':'Laporan Pembelian',per,wide:true,
      summary:[['Jumlah transaksi',rows.length],[S?'Total penjualan':'Total pembelian',rp(T)],['Sudah dibayar',rp(Pd)],[S?'Piutang (belum dibayar)':'Utang (belum dibayar)',rp(T-Pd)]],
      head:['Tanggal','Kode','Item','Qty','Harga','Total','Dibayar','Sisa','Status'],right:[3,4,5,6,7],
      body:rows.map(x=>[fd(x.date),code(x),iname(x),nf(x.qty),rp(x.price),rp(x.total),rp(pa(x)),rp(re(x)),stf(x)]),
      foot:[['','','Total',nf(Q),'',rp(T),rp(Pd),rp(T-Pd),'']],
      extra:{title:S?'Rekap per Produk':'Rekap per Bahan Baku',head:[S?'Produk':'Bahan Baku','Qty','Total'],right:[1,2],body:rk.map(([n,v])=>[n,nf(v.q),rp(v.t)]),foot:[['Total',nf(Q),rp(T)]]}};
  }
  if(type=='wallet'){
    if(RW!='all'&&!D.Wallets.some(w=>w.id==RW))RW='all';
    const ws=RW=='all'?D.Wallets:D.Wallets.filter(w=>w.id==RW);
    const calc=w=>{const mv=wMoves(w),open=(+w.initial||0)+mv.filter(m=>m.date<a).reduce((q,m)=>q+m.amt,0);
      const pm=mv.filter(m=>m.date>=a&&m.date<=b).reverse().sort((x,y)=>x.date.localeCompare(y.date));
      const i=pm.reduce((q,m)=>q+(m.amt>0?m.amt:0),0),o=pm.reduce((q,m)=>q+(m.amt<0?-m.amt:0),0);
      return{w,open,pm,i,o,close:open+i-o}};
    const cs=ws.map(calc),S=k=>cs.reduce((q,c)=>q+c[k],0);
    if(RW=='all')return{title:'Laporan Saldo Dompet & Rekening',per,wide:false,
      summary:[['Total saldo awal',rp(S('open'))],['Total masuk',rp(S('i'))],['Total keluar',rp(S('o'))],['Total saldo akhir',rp(S('close'))]],
      head:['Dompet/Rekening','Jenis','Saldo awal','Masuk','Keluar','Saldo akhir'],right:[2,3,4,5],
      body:cs.map(c=>[c.w.name,c.w.type,rp(c.open),rp(c.i),rp(c.o),rp(c.close)]),
      foot:[['Total','',rp(S('open')),rp(S('i')),rp(S('o')),rp(S('close'))]]};
    const c=cs[0];let run=c.open;
    return{title:'Laporan Saldo - '+c.w.name,per,wide:false,
      summary:[['Dompet/Rekening',c.w.name+' ('+c.w.type+')'],['Saldo awal',rp(c.open)],['Total masuk',rp(c.i)],['Total keluar',rp(c.o)],['Saldo akhir',rp(c.close)]],
      head:['Tanggal','Kode','Keterangan','Masuk','Keluar','Saldo'],right:[3,4,5],
      body:[['','','Saldo awal','','',rp(c.open)],...c.pm.map(m=>{run+=m.amt;return[fd(m.date),m.code||'',m.title+(m.sub?' · '+m.sub:''),m.amt>0?rp(m.amt):'',m.amt<0?rp(-m.amt):'',rp(run)]})],
      foot:[['','','Total',rp(c.i),rp(c.o),rp(c.close)]]};
  }
  const t=repTx(p).slice().reverse(),i=sum(t.filter(x=>x.in&&!x.due)),o=sum(t.filter(x=>!x.in&&!x.due)),pi=t.filter(x=>x.due&&x.in).reduce((q,x)=>q+x.rest,0),ut=t.filter(x=>x.due&&!x.in).reduce((q,x)=>q+x.rest,0);
  return{title:'Laporan Keuangan',per,wide:true,
    summary:[['Penjualan (lunas)',rp(i)],['Pembelian',rp(o)],['Selisih saldo',rp(i-o)],['Piutang belum dibayar',rp(pi)],['Utang belum dibayar',rp(ut)]],
    head:['Tanggal','Kode','Jenis','Keterangan','Qty','Masuk','Keluar'],right:[4,5,6],
    body:t.map(x=>[fd(x.date),code(x),x.k,iname(x),nf(x.qty),x.in&&!x.due?rp(x.total):'',x.in||x.due?'':rp(x.total)]),
    foot:[['','','','Total','',rp(i),rp(o)],['','','','Selisih saldo','',rp(i-o),'']]};
}
function tbl(h,b,f,right,cls){
  const c=(v,i,t='td')=>`<${t} class="${right.includes(i)?'r':''}">${esc(v)}</${t}>`;
  return `<table class="${cls||''}"><tr>${h.map((v,i)=>c(v,i,'th')).join('')}</tr>${b.map(r=>`<tr>${r.map((v,i)=>c(v,i)).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}">Tidak ada data pada periode ini</td></tr>`}${(f||[]).map(r=>`<tr class="tf">${r.map((v,i)=>c(v,i)).join('')}</tr>`).join('')}</table>`;
}

function printRep(){$('#pg').textContent=repData(RT).wide?'@page{size:A4 landscape;margin:10mm}':'@page{size:A4;margin:12mm}';setTimeout(()=>window.print(),60)}
function pdfRep(){
  if(!window.jspdf)return toast('Library PDF belum termuat, coba lagi');
  const d=repData(RT),st=getStore(),doc=new window.jspdf.jsPDF({orientation:d.wide?'l':'p'});
  let y=14;doc.setFontSize(14);doc.text(st.name||'MyPOS',14,y);doc.setFontSize(8);
  [st.address,st.phone?'Telp/WA: '+st.phone:''].filter(Boolean).forEach(t=>{y+=4.5;doc.text(String(t).split('\n').join(', '),14,y)});
  y+=8;doc.setFontSize(12);doc.text(d.title,14,y);y+=5;doc.setFontSize(9);doc.text('Periode: '+d.per,14,y);
  d.summary.forEach(([k,v])=>{y+=4.5;doc.text(k+': '+v,14,y)});
  const at=(o,sy)=>doc.autoTable({startY:sy,styles:{fontSize:7.5},headStyles:{fillColor:[15,118,110]},footStyles:{fillColor:[230,240,238],textColor:20},head:[o.head],body:o.body,foot:o.foot,showFoot:'lastPage',columnStyles:Object.fromEntries(o.right.map(i=>[i,{halign:'right'}]))});
  at(d,y+4);
  if(d.extra){const fy=doc.lastAutoTable.finalY+8;doc.setFontSize(10);doc.text(d.extra.title,14,fy);at(d.extra,fy+3)}
  doc.save('mypos_'+RT+'_'+rng(P.rep)[0]+'.pdf');
}

// ---------- tombol Kembali (navigation bar HP) & Enter keyboard ----------
history.replaceState({v:view},'');
addEventListener('popstate',e=>{
  if(modalOpen())return hideM();
  const v=e.state&&e.state.v;if(v&&v!=view){view=v;render()}
});
const scope=t=>t.closest('#mb,.auth,.acc .ab')||document;
const fields=sc=>[...sc.querySelectorAll('input,select,textarea')].filter(x=>!x.disabled&&x.offsetParent);
document.addEventListener('focusin',e=>{
  const t=e.target;if(!t.matches||!t.matches('input,select'))return;
  const sc=scope(t);if(sc===document)return;
  const f=fields(sc);t.enterKeyHint=f.indexOf(t)<f.length-1?'next':'go';
});
document.addEventListener('keydown',e=>{
  if(e.key=='Escape'&&modalOpen())return closeM();
  if(e.key!='Enter'||!e.target.matches||!e.target.matches('input'))return;
  const sc=scope(e.target);if(sc===document)return;
  e.preventDefault();
  const f=fields(sc),i=f.indexOf(e.target);
  if(i>=0&&i<f.length-1)f[i+1].focus();else{const b=sc.querySelector('.btn');if(b)b.click()}
});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();if(tok)sync();
</script></body></html>
